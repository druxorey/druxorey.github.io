<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Druxorey | Apuntes Académicos</title>
  <meta name="description" content="Apuntes universitarios, notas de estudio y resúmenes de asignaturas de informática organizados por materias y secuencia temática por Druxorey.">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="/images/logo.svg">
  <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body>

  <header class="navbar">
    <div class="container">
      <a href="./index.html" class="nav-brand" id="navBrandLink">
        <img src="/images/logo.svg" alt="Druxorey Logo" class="nav-logo-img">
        <span>druxorey</span>
      </a>

      <nav>
        <ul class="nav-links">
          <li><a href="./index.html" class="nav-link">Sobre mí</a></li>
          <li><a href="./projects.html" class="nav-link">Proyectos</a></li>
          <li><a href="./publications.html" class="nav-link">Publicaciones</a></li>
          <li><a href="./notes.html" class="nav-link active">Apuntes</a></li>
          <li><a href="./contact.html" class="nav-link">Contacto</a></li>
        </ul>
      </nav>

      <button id="navToggleBtn" class="nav-toggle-btn" aria-label="Abrir menú" aria-expanded="false">
        <svg class="nav-toggle-icon" viewBox="0 0 24 24">
          <path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <div id="mobileMenu" class="mobile-menu">
      <a href="./index.html" class="nav-link">Sobre mí</a>
      <a href="./projects.html" class="nav-link">Proyectos</a>
      <a href="./publications.html" class="nav-link">Publicaciones</a>
      <a href="./notes.html" class="nav-link active">Apuntes</a>
      <a href="./contact.html" class="nav-link">Contacto</a>
    </div>
  </header>

  <main class="main-content">
    <div class="container">

      <header class="page-header">
        <h1 class="page-title">Apuntes Universitarios</h1>
      </header>

      <section class="notes-search-section">
        <div class="notes-search-wrap">
          <input
            type="text"
            id="notesSearchInput"
            class="input-search"
            placeholder="Buscar en apuntes por título, contenido, materia o etiqueta..."
            aria-label="Buscar apuntes académicos"
          />
        </div>

        <div class="notes-filters-row">
          <div id="notesTagsContainer" class="notes-tags-list"></div>
          <span id="notesCount" class="notes-count-indicator">
            Cargando apuntes...
          </span>
        </div>
      </section>

      <!-- 2-Column Layout (Left: Subject Folders, Right: Notes Feed) -->
      <div class="notes-grid-layout">

        <aside class="notes-sidebar" aria-label="Navegación por materias">
          <div class="notes-sidebar-header">
            <svg class="notes-sidebar-header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
            </svg>
            <span class="notes-sidebar-header-title">Materias</span>
          </div>

          <ul id="notesSubjectsList" class="notes-sidebar-list">
            <!-- Renderizado dinámico desde notes.ts -->
          </ul>
        </aside>

        <section class="notes-main-content">
          <div id="notesContainer" class="notes-cards-list">
            <!-- Renderizado dinámico desde notes.ts -->
          </div>
        </section>

      </div>

    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div>
        <span>Druxorey &copy; 2026</span> · <span>GPL-3.0 License</span>
      </div>
      <div class="footer-links">
        <a href="./index.html">Sobre mí</a>
        <a href="./projects.html">Proyectos</a>
        <a href="./publications.html">Publicaciones</a>
        <a href="./notes.html">Apuntes</a>
        <a href="./contact.html">Contacto</a>
        <a href="https://github.com/druxorey" target="_blank" rel="noopener noreferrer">GitHub</a>
      </div>
    </div>
  </footer>

  <script type="module" src="/src/scripts/main.ts"></script>
  <script type="module" src="/src/scripts/notes.ts"></script>
</body>
</html>
