name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permisos necesarios para GitHub Pages con el método actions/deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Solo un deploy a la vez; cancela el anterior si hay uno en curso
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del código fuente
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Instalar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Instalar Pandoc (necesario para compilar Markdown → HTML)
      - name: Install Pandoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pandoc

      # 4. Instalar dependencias de Node
      - name: Install Node dependencies
        run: npm ci

      # 5. Configurar GitHub Pages (inyecta la base URL correcta)
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 6. Build completo:
      #    - prebuild.py → sync GitHub projects + compila markdown → HTML
      #    - tsc → verificación de tipos TypeScript
      #    - vite build → bundle final en dist/
      - name: Build site
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 7. Subir el artefacto de dist/ para que deploy-pages lo publique
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
